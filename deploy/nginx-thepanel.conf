# ThePanel — mount under the existing nginx server block (http://31.57.33.191/)
# Add these location blocks to the server { } that serves the main site,
# then: nginx -t && systemctl reload nginx

# bare /thePanel -> /thePanel/
location = /thePanel {
    return 301 /thePanel/;
}

# Static frontend build (Vite, base=/thePanel/)
location /thePanel/ {
    alias /opt/thepanel/frontend/dist/;
    try_files $uri $uri/ /thePanel/index.html;
}

# API -> Express backend on localhost:3001 (path /thePanel/api/xxx -> /api/xxx)
location /thePanel/api/ {
    proxy_pass http://127.0.0.1:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
